<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbypTEWtC1-NJ8JanHvqa2p7LMH26vlxmKuJS-4ijqNbyseEU4aWJMtDoVihk_iwH2Ar/exec";

    let products = [];
    let filteredProducts = [];
    let quantities = {};
    let lastOrderPayload = null;

    // Bulletproof dual-loader: Tries Google Apps Script, falls back to local products.json
    window.onload = function() {
      let loaded = false;

      // Timeout safety: If Google API doesn't answer within 3 seconds, switch to local products.json
      const timeoutTrigger = setTimeout(() => {
        if (!loaded) {
          console.warn("Google API timeout. Loading local products.json...");
          loadLocalBackup();
        }
      }, 3000);

      // JSONP callback
      window.handleProductData = function(data) {
        if (loaded) return;
        loaded = true;
        clearTimeout(timeoutTrigger);

        if (data && data.error) {
          loadLocalBackup();
          return;
        }

        products = data || [];
        filteredProducts = [...products];
        document.getElementById('loadingSpinner').classList.add('d-none');
        document.getElementById('tableWrapper').classList.remove('d-none');
        renderProductsTable();
      };

      // Try fetching Google Apps Script via dynamic script tag
      const script = document.createElement('script');
      script.src = `${API_URL}?callback=handleProductData`;
      
      script.onerror = function() {
        if (!loaded) loadLocalBackup();
      };

      document.body.appendChild(script);
    };

    function loadLocalBackup() {
      fetch('./products.json')
        .then(res => {
          if (!res.ok) throw new Error("Local products.json file not found");
          return res.json();
        })
        .then(data => {
          products = data || [];
          filteredProducts = [...products];
          document.getElementById('loadingSpinner').classList.add('d-none');
          document.getElementById('tableWrapper').classList.remove('d-none');
          renderProductsTable();
        })
        .catch(err => {
          showError("Unable to load products. Please refresh or disconnect from VPN.");
        });
    }

    function showError(msg) {
      document.getElementById('loadingSpinner').innerHTML = `
        <div class="alert alert-danger mx-auto" style="max-width: 600px;">
          <strong>Error Loading Product Data:</strong> ${msg}
        </div>`;
    }

    function filterProducts() {
      const term = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!term) {
        filteredProducts = [...products];
      } else {
        filteredProducts = products.filter(p => 
          p.name.toLowerCase().includes(term) || 
          p.slNo.toLowerCase().includes(term) ||
          p.category.toLowerCase().includes(term)
        );
      }
      renderProductsTable();
    }

    function renderProductsTable() {
      const tbody = document.getElementById('productTableBody');
      tbody.innerHTML = '';

      if (filteredProducts.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">No products found</td></tr>`;
        return;
      }

      let currentCategory = '';

      filteredProducts.forEach(p => {
        if (p.category !== currentCategory) {
          currentCategory = p.category;
          const catRow = document.createElement('tr');
          catRow.innerHTML = `
            <td colspan="6" class="p-0">
              <div class="category-header d-inline-block">${currentCategory}</div>
            </td>
          `;
          tbody.appendChild(catRow);
        }

        const qty = quantities[p.slNo] || 0;
        const subTotal = qty * p.payablePrice;
        const isSoldOut = p.stock <= 0;

        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="text-center">
            <img src="${p.imageUrl}" class="product-img" alt="${p.name}" onerror="this.src='https://placehold.co/80x80/ffe0b2/e65100?text=Cracker'">
          </td>
          <td>
            <div class="fw-bold text-dark">${p.name}</div>
            <small class="text-muted">Code / Sl.No: ${p.slNo}</small>
          </td>
          <td class="text-center">
            ${isSoldOut ? 
              `<span class="stock-badge stock-out">Out of Stock</span>` : 
              `<span class="stock-badge stock-in">${p.stock} Available</span>`
            }
          </td>
          <td class="text-center">
            <span class="price-discounted">&#8377;${p.payablePrice.toFixed(2)}</span>
            <span class="price-original">&#8377;${p.originalPrice.toFixed(2)}</span>
          </td>
          <td class="text-center">
            ${isSoldOut ? 
              `<span class="sold-out-badge">SOLD OUT</span>` : 
              `<input type="number" class="form-control qty-input mx-auto" min="0" max="${p.stock}" value="${qty}" onchange="updateQty('${p.slNo}', this.value)" onkeyup="updateQty('${p.slNo}', this.value)">`
            }
          </td>
          <td class="text-end pe-4 fw-bold fs-6">
            &#8377;<span id="subtotal-${p.slNo}">${subTotal}</span>
          </td>
        `;
        tbody.appendChild(row);
      });

      calculateDashboard();
    }

    function updateQty(slNo, value) {
      let q = parseInt(value, 10);
      if (isNaN(q) || q < 0) q = 0;

      const product = products.find(p => p.slNo === slNo);
      if (product) {
        if (product.stock <= 0) {
          alert(`Product '${product.name}' is SOLD OUT and cannot be ordered.`);
          q = 0;
        } else if (q > product.stock) {
          q = product.stock;
          alert(`Only ${product.stock} items available in stock!`);
        }
      }

      quantities[slNo] = q;
      const subtotalEl = document.getElementById(`subtotal-${slNo}`);
      if (subtotalEl) {
        subtotalEl.innerText = (q * (product ? product.payablePrice : 0));
      }
      calculateDashboard();
    }

    function calculateDashboard() {
      let totalProducts = 0;
      let totalItems = 0;
      let totalPayable = 0;
      let totalOriginal = 0;

      products.forEach(p => {
        const q = quantities[p.slNo] || 0;
        if (q > 0) {
          totalProducts++;
          totalItems += q;
          totalPayable += q * p.payablePrice;
          totalOriginal += q * p.originalPrice;
        }
      });

      const totalSave = totalOriginal - totalPayable;

      document.getElementById('dashProducts').innerText = totalProducts;
      document.getElementById('dashItems').innerText = totalItems;
      document.getElementById('dashTotal').innerText = totalPayable;
      document.getElementById('dashSave').innerText = totalSave;

      document.getElementById('modalProdCount').innerText = totalProducts;
      document.getElementById('modalItemCount').innerText = totalItems;
      document.getElementById('modalTotalAmount').innerText = totalPayable;
    }

    function openOrderModal() {
      let totalItems = 0;
      Object.values(quantities).forEach(q => totalItems += q);

      if (totalItems === 0) {
        alert("Please select quantity for at least one item before submitting.");
        return;
      }

      const modalTableBody = document.getElementById('modalItemsListBody');
      modalTableBody.innerHTML = '';

      products.forEach(p => {
        const q = quantities[p.slNo] || 0;
        if (q > 0) {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td class="ps-2 fw-semibold">${p.name} <small class="text-muted">(${p.slNo})</small></td>
            <td class="text-center">&#8377;${p.payablePrice}</td>
            <td class="text-center fw-bold">${q}</td>
            <td class="text-end pe-2 fw-bold text-success">&#8377;${q * p.payablePrice}</td>
          `;
          modalTableBody.appendChild(row);
        }
      });

      const modal = new bootstrap.Modal(document.getElementById('orderModal'));
      modal.show();
    }

    document.getElementById('customerForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();

      const selectedItems = [];
      let overallAmount = 0;

      products.forEach(p => {
        const q = quantities[p.slNo] || 0;
        if (q > 0) {
          selectedItems.push({
            slNo: p.slNo,
            name: p.name,
            originalPrice: p.originalPrice,
            payablePrice: p.payablePrice,
            qty: q
          });
          overallAmount += q * p.payablePrice;
        }
      });

      const orderPayload = {
        name: name,
        phone: phone,
        address: address,
        items: selectedItems,
        overallAmount: overallAmount
      };

      lastOrderPayload = orderPayload;

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Processing...`;

      fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(orderPayload)
      })
      .then(() => {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'SUBMIT ENQUIRY';

        bootstrap.Modal.getInstance(document.getElementById('orderModal')).hide();

        document.getElementById('successCustName').innerText = orderPayload.name;
        document.getElementById('successSheetName').innerText = "Order Recorded";
        document.getElementById('successTotal').innerText = orderPayload.overallAmount;

        const successModal = new bootstrap.Modal(document.getElementById('successModal'));
        successModal.show();

        triggerCrackerBurstAnimation();
      })
      .catch(err => {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'SUBMIT ENQUIRY';
        alert("Error submitting order: " + err);
      });
    });

    function resetPageForNewEntry() {
      window.location.reload();
    }

    function triggerCrackerBurstAnimation() {
      if (typeof confetti === 'function') {
        var duration = 3 * 1000;
        var animationEnd = Date.now() + duration;
        var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 2000 };

        function randomInRange(min, max) {
          return Math.random() * (max - min) + min;
        }

        var interval = setInterval(function() {
          var timeLeft = animationEnd - Date.now();
          if (timeLeft <= 0) return clearInterval(interval);

          var particleCount = 50 * (timeLeft / duration);
          confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
          confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
        }, 250);
      }
    }

    function downloadOrPrintPDF() {
      if (lastOrderPayload) {
        generateAndPrintPDF(lastOrderPayload);
      } else {
        alert("Order details not found.");
      }
    }

    function generateAndPrintPDF(order) {
      const printWin = window.open('', '_blank', 'width=800,height=900');
      if (!printWin) {
        alert("Please allow pop-ups for this site to view the PDF estimate.");
        return;
      }

      let rowsHtml = '';
      order.items.forEach(item => {
        rowsHtml += `
          <tr>
            <td>${item.slNo}</td>
            <td>${item.name}</td>
            <td>Rs. ${item.originalPrice}</td>
            <td>Rs. ${item.payablePrice}</td>
            <td>${item.qty}</td>
            <td>Rs. ${item.qty * item.payablePrice}</td>
          </tr>
        `;
      });

      printWin.document.write(`
        <html>
          <head>
            <title>Quotation - ${order.name}</title>
            <style>
              body { font-family: Arial, sans-serif; padding: 25px; color: #333; }
              .header { text-align: center; border-bottom: 2px solid #d32f2f; padding-bottom: 10px; margin-bottom: 20px; }
              .header h2 { color: #d32f2f; margin: 0; }
              .details { display: flex; justify-content: space-between; margin-bottom: 20px; }
              table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
              th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
              th { background-color: #f0f3d0; }
              .total { text-align: right; font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; }
              .note { background: #fff3cd; border: 1px solid #ffeeba; padding: 12px; border-radius: 4px; text-align: center; }
            </style>
          </head>
          <body>
            <div class="header">
              <h2>THIRUMALA TRADING COMPANY</h2>
              <p>Sivakasi, Tamil Nadu | Licence No: xxx/2024</p>
              <h3>DIWALI CRACKERS ESTIMATION QUOTATION</h3>
            </div>
            <div class="details">
              <div>
                <strong>Customer Name:</strong> ${order.name}<br>
                <strong>Phone:</strong> ${order.phone}<br>
                <strong>Address:</strong> ${order.address}
              </div>
              <div style="text-align: right;">
                <strong>Date:</strong> ${new Date().toLocaleString()}<br>
                <strong>Status:</strong> Order Submitted
              </div>
            </div>
            <table>
              <thead>
                <tr>
                  <th>Sl.No</th>
                  <th>Product Description</th>
                  <th>Original Price</th>
                  <th>Offer Price</th>
                  <th>Qty</th>
                  <th>Sub-Total</th>
                </tr>
              </thead>
              <tbody>
                ${rowsHtml}
              </tbody>
            </table>
            <div class="total">
              Overall Payable Amount: Rs. ${order.overallAmount}
            </div>
            <div class="note">
              <strong>Team will contact within 12 hours</strong> to confirm your order details and delivery timetable.
            </div>
          </body>
        </html>
      `);
      printWin.document.close();
      printWin.focus();
    }

    function shareWhatsApp() {
      const text = `Check out 2026 Crackers Price List: ${window.location.href}`;
      window.open(`https://web.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
    }
  </script>
